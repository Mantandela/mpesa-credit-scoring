name: tests

# Runs the whole test suite on every push and on every pull request.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy scikit-learn xgboost pyarrow openpyxl matplotlib joblib pytest
          python -m pip install shap pdfplumber pypdf reportlab cryptography "streamlit>=1.50"
          python -m pip install "sqlalchemy==2.1.9" "psycopg[binary]==3.3.9"

      - name: Run tests
        run: python -m pytest tests -q

  # The app's database tests again, on a real PostgreSQL 16 (the job above runs them on SQLite).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: creditscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d creditscore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/creditscore_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the PostgreSQL tests
        run: python -m pytest tests -m postgres -q -rs
