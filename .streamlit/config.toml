[theme]
base = "light"
primaryColor = "#5B3FC4"
backgroundColor = "#F5F2FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1B3A"
font = "Roboto, sans-serif"
# status words inside widget and expander labels use markdown colours; make them the exact status colours
greenTextColor = "#067647"
orangeTextColor = "#B45309"
redTextColor = "#B42318"
grayTextColor = "#6B6B85"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
# never show tracebacks to users (an exception message could quote a statement cell)
showErrorDetails = "none"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false
